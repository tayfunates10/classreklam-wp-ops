name: SEO Structure Diagnostic (Read Only)

on:
  push:
    branches:
      - seo/full-seo-optimization
    paths:
      - '.github/workflows/seo-structure-diagnostic.yml'
      - 'scripts/seo_structure_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classreklam-seo-structure-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Collect read-only WordPress structure diagnostics
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seo_structure_diagnostic.py

      - name: Save diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .ops/seo-structure-diagnostic-2026-08-14.json
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/seo-structure-diagnostic-2026-08-14.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record SEO structure diagnostic evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
