name: Homepage SEO Snapshot

on:
  push:
    paths:
      - '.github/workflows/homepage-seo-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture homepage and generated SEO head
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ops
          base="${WP_URL%/}"
          auth=(--user "${WP_USER}:${WP_APP_PASSWORD}" --header 'Accept: application/json')

          curl --fail --silent --show-error "${auth[@]}" \
            "${base}/wp-json/wp/v2/pages/6?context=edit&_fields=id,slug,status,link,title,content,excerpt,meta,modified" \
            > /tmp/homepage.json

          head_http="$(curl --silent --show-error --output /tmp/rankmath-head.json --write-out '%{http_code}' \
            "${base}/wp-json/rankmath/v1/getHead?url=${base}/" || true)"

          if [ "$head_http" != "200" ]; then
            printf '{}\n' > /tmp/rankmath-head.json
          fi

          jq -n \
            --arg checked_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg rankmath_head_http "$head_http" \
            --slurpfile page /tmp/homepage.json \
            --slurpfile head /tmp/rankmath-head.json \
            '{checked_at:$checked_at, page:$page[0], rankmath_head_http:$rankmath_head_http, rankmath:$head[0]}' \
            > .ops/homepage-seo-snapshot.json

      - name: Save snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/homepage-seo-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: snapshot homepage SEO state'
          git push
