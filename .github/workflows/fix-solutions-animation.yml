name: Fix Solutions Hero Animation

on:
  push:
    paths:
      - '.github/workflows/fix-solutions-animation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Apply animation fix
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          python3 scripts/fix_solutions_animation_queryrest.py > /tmp/out 2>/tmp/err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); out=pathlib.Path('/tmp/out').read_text(errors='replace').strip(); err=pathlib.Path('/tmp/err').read_text(errors='replace').strip()
          payload={'status':'success' if rc==0 else 'failed','exit_code':rc,'stderr':err[-12000:]}
          if rc==0:
              try: payload['result']=json.loads(out)
              except Exception: payload['stdout']=out[-20000:]
          else: payload['stdout']=out[-20000:]
          pathlib.Path('.ops/solutions-animation-fix.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0
      - name: Verify live HTML override order
        env:
          WP_URL: ${{ secrets.WP_URL }}
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          base=os.environ['WP_URL'].rstrip('/')
          url=base+'/?cranim='+str(int(time.time()))
          cp=subprocess.run(['curl','-sS','-L','--max-time','30','-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/138.0.0.0 Safari/537.36',url],capture_output=True,text=True)
          html=cp.stdout
          new_pos=html.rfind('cr-solutions-animation-v2')
          old_positions=[html.rfind('cr-red-white-title-flow'),html.rfind('cr-profesyonel-renk-gecisi'),html.rfind('cr-profesyonel-beyaz-parlama'),html.rfind('cr-title-red-soft-white')]
          max_old=max(old_positions) if old_positions else -1
          payload={
            'curl_exit':cp.returncode,
            'waf_challenge':'One moment, please' in html or 'Imunify360' in html,
            'new_override_present':new_pos >= 0,
            'seamless_keyframe_present':'@keyframes cr-solutions-color-seamless' in html,
            'alternate_loop_present':'infinite alternate both' in html,
            'new_override_after_old_rules':new_pos > max_old if new_pos >= 0 else False,
            'old_rule_positions':old_positions,
            'new_override_position':new_pos,
          }
          pathlib.Path('.ops/solutions-animation-live.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/solutions-animation-fix.json .ops/solutions-animation-live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record seamless solutions animation verification'
          git pull --rebase origin main
          git push
