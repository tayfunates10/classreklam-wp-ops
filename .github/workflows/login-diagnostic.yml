name: WordPress Login Diagnostic

on:
  push:
    paths:
      - '.github/workflows/login-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose login without exposing credentials
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_LOGIN_USER: ${{ secrets.WP_LOGIN_USER }}
          WP_LOGIN_PASSWORD: ${{ secrets.WP_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          base="${WP_URL%/}"
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          jar=/tmp/wp-cookies.txt
          curl -A "$ua" -sS --max-time 20 -c "$jar" "$base/wp-login.php" -o /tmp/pre.html
          curl -A "$ua" -sS --max-time 30 -b "$jar" -c "$jar" -L \
            --data-urlencode "log=$WP_LOGIN_USER" \
            --data-urlencode "pwd=$WP_LOGIN_PASSWORD" \
            --data-urlencode "wp-submit=Log In" \
            --data-urlencode "redirect_to=$base/wp-admin/" \
            --data-urlencode "testcookie=1" \
            -w '%{http_code}\n%{url_effective}\n%{num_redirects}\n' \
            "$base/wp-login.php" -o /tmp/post.html > /tmp/curl.meta
          python3 - <<'PY'
          import json,re,pathlib,html as htmlmod,os
          meta=pathlib.Path('/tmp/curl.meta').read_text(errors='replace').splitlines()
          raw=pathlib.Path('/tmp/post.html').read_text(errors='replace')
          cookie_names=[]
          p=pathlib.Path('/tmp/wp-cookies.txt')
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  parts=line.split('\t')
                  if len(parts)>=7 and (not line.startswith('#') or line.startswith('#HttpOnly_')):
                      cookie_names.append(parts[5])
          err=''
          m=re.search(r'id=["\']login_error["\'][^>]*>(.*?)</div>',raw,re.I|re.S)
          if m:
              err=htmlmod.unescape(re.sub(r'<[^>]+>',' ',m.group(1)))
              err=re.sub(r'\s+',' ',err).strip()
              user=os.environ.get('WP_LOGIN_USER','')
              if user: err=err.replace(user,'<redacted-user>')
              err=err[:700]
          low=err.lower()
          category='unknown'
          if any(x in low for x in ['bilinmeyen kullanıcı adı','unknown username','invalid username','kayıtlı değil','not registered']): category='username-not-found'
          elif any(x in low for x in ['parola','şifre','password','incorrect']): category='password-incorrect-or-credential-error'
          elif 'wordpress_logged_in_' in ' '.join(cookie_names): category='login-success'
          result={
            'status':'diagnostic-v3',
            'http_code':meta[0] if meta else '',
            'final_url':meta[1] if len(meta)>1 else '',
            'redirects':meta[2] if len(meta)>2 else '',
            'cookie_names':sorted(set(cookie_names)),
            'login_error_category':category,
            'sanitized_login_error':err,
            'login_user_present':bool(os.environ.get('WP_LOGIN_USER')),
            'login_password_present':bool(os.environ.get('WP_LOGIN_PASSWORD')),
          }
          pathlib.Path('.ops/login-diagnostic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/login-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record WordPress login diagnostic v3'
          git pull --rebase origin main
          git push
