name: Remove Legal Links From Header Only

on:
  push:
    branches:
      - seo/full-seo-optimization
    paths:
      - '.github/workflows/remove-legal-links-from-header-only.yml'
      - 'scripts/remove_legal_links_from_header_only.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classreklam-header-restore
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Remove only legal links from header menu
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remove_legal_links_from_header_only.py

      - name: Save evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in .ops/header-legal-links-only-2026-08-15.json .ops/header-legal-links-backup-2026-08-15.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record header legal-link cleanup evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Only header legal-page menu items are removed. Pages and footer links are preserved.
