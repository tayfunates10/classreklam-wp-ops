name: Purge LiteSpeed Homepage Cache

on:
  push:
    paths:
      - '.github/workflows/purge-litespeed-home-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply continuous JS V4 animation
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          python3 scripts/fix_solutions_animation_js_continuous.py > /tmp/v4.out 2>/tmp/v4.err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); out=pathlib.Path('/tmp/v4.out').read_text(errors='replace').strip(); err=pathlib.Path('/tmp/v4.err').read_text(errors='replace').strip()
          payload={'runner_exit':rc,'stderr':err[-12000:]}
          try: payload['result']=json.loads(out)
          except Exception: payload['stdout']=out[-30000:]
          pathlib.Path('.ops/solutions-animation-js-v4.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0

      - name: Temporarily integrate LiteSpeed and purge homepage
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          python3 scripts/purge_litespeed_home_cache.py > /tmp/out 2>/tmp/err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); out=pathlib.Path('/tmp/out').read_text(errors='replace').strip(); err=pathlib.Path('/tmp/err').read_text(errors='replace').strip()
          payload={'runner_exit':rc,'stderr':err[-12000:]}
          try: payload['result']=json.loads(out)
          except Exception: payload['stdout']=out[-30000:]
          pathlib.Path('.ops/litespeed-home-purge.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0

      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/solutions-animation-js-v4.json .ops/litespeed-home-purge.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record JS V4 deployment and LiteSpeed purge result'
          git pull --rebase origin main
          git push

