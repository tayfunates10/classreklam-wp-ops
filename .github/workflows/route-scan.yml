name: WordPress REST Route Scan

on:
  push:
    paths:
      - '.github/workflows/route-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public REST routes
        env:
          WP_URL: ${{ secrets.WP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ops
          base="${WP_URL%/}"
          curl --fail --silent --show-error "$base/wp-json/" > /tmp/root.json
          jq '{namespaces:.namespaces, seo_routes:(.routes|keys|map(select(test("rank|seo|wpcode|redirect|snippet";"i"))))}' /tmp/root.json > .ops/seo-rest-routes.json
      - name: Commit route scan
        shell: bash
        run: |
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/seo-rest-routes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record available SEO REST routes'
          git pull --rebase origin main
          git push
