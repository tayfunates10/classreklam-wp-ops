name: Apply Phase 2 via Query REST

on:
  push:
    paths:
      - '.github/workflows/apply-phase1-queryrest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 2
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          python3 scripts/apply_phase2_queryrest.py > /tmp/out 2>/tmp/err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1])
          out=pathlib.Path('/tmp/out').read_text(errors='replace').strip()
          err=pathlib.Path('/tmp/err').read_text(errors='replace').strip()
          pathlib.Path('.ops/phase2-queryrest.json').write_text(json.dumps({'status':'success' if rc==0 else 'failed','exit_code':rc,'stdout':out[-20000:],'stderr':err[-20000:]},ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/phase2-queryrest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record Phase 2 query-rest result'
          git pull --rebase origin main
          git push

