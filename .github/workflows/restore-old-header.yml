name: Restore Old Header

on:
  push:
    branches:
      - seo/full-seo-optimization
    paths:
      - '.github/workflows/restore-old-header.yml'
      - 'scripts/restore_header_baseline_remove_extras.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classreklam-header-baseline-final
  cancel-in-progress: true

jobs:
  restore:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Restore SEO-start header baseline and remove extra service links
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore_header_baseline_remove_extras.py

      - name: Save restore evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in .ops/header-baseline-restore-2026-08-15.json .ops/header-baseline-restore-backup-2026-08-15.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record baseline header restore evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
