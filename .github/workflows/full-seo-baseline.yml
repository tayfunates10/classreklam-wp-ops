name: Full SEO Baseline (Branch Only)

on:
  push:
    branches:
      - seo/full-seo-optimization
    paths:
      - '.github/workflows/full-seo-baseline.yml'
      - 'scripts/full_seo_baseline_queryrest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Collect read-only SEO baseline
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ops
          python3 scripts/full_seo_baseline_queryrest.py > .ops/full-seo-baseline-2026-08-14.json
          python3 -m json.tool .ops/full-seo-baseline-2026-08-14.json >/dev/null

      - name: Save branch baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/full-seo-baseline-2026-08-14.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record 2026-08-14 full SEO baseline'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
