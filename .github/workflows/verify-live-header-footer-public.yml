name: Verify Live Header Footer Public

on:
  push:
    paths:
      - '.github/workflows/verify-live-header-footer-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify public HTML
        env:
          WP_URL: ${{ secrets.WP_URL }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          python3 scripts/verify_live_header_footer_public.py > /tmp/out 2>/tmp/err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]);out=pathlib.Path('/tmp/out').read_text(errors='replace').strip();err=pathlib.Path('/tmp/err').read_text(errors='replace').strip()
          p={'exit_code':rc,'stderr':err[-8000:]}
          if out:
              try:p['result']=json.loads(out)
              except:p['stdout']=out[-20000:]
          pathlib.Path('.ops/live-header-footer-public.json').write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/live-header-footer-public.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record live public header footer verification'
          git pull --rebase origin main
          git push
