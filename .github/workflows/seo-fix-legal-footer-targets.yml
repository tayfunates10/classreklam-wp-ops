name: Guarded Legal Footer Target Repair

on:
  push:
    branches:
      - seo/full-seo-optimization
    paths:
      - '.github/workflows/seo-fix-legal-footer-targets.yml'
      - 'scripts/seo_fix_legal_footer_targets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classreklam-fix-legal-footer-targets
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Repair broken legal footer targets
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seo_fix_legal_footer_targets.py

      - name: Save legal target evidence and backup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in \
            .ops/seo-legal-footer-targets-2026-08-14.json \
            .ops/seo-legal-footer-targets-backup-2026-08-14.json; do
              if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record legal footer target repair evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
