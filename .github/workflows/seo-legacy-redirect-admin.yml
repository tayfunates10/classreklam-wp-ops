name: Guarded Legacy Redirect Admin Fallback

on:
  push:
    branches:
      - seo/full-seo-optimization
    paths:
      - '.github/workflows/seo-legacy-redirect-admin.yml'
      - 'scripts/seo_legacy_redirect_admin.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classreklam-legacy-redirect-admin
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply exact legacy redirect with admin session
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_SESSION_COOKIE_HEADER: ${{ secrets.WP_SESSION_COOKIE_HEADER }}
          WP_REST_NONCE: ${{ secrets.WP_REST_NONCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seo_legacy_redirect_admin.py

      - name: Save redirect evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .ops/seo-legacy-redirect-admin-2026-08-14.json ]; then
            exit 1
          fi
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/seo-legacy-redirect-admin-2026-08-14.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record admin legacy redirect evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
