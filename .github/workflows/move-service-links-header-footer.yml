name: Move Service Links Header Footer

on:
  push:
    paths:
      - '.github/workflows/move-service-links-header-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply header/footer service-link change
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          python3 scripts/move_service_links_header_to_footer.py > /tmp/out 2>/tmp/err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); out=pathlib.Path('/tmp/out').read_text(errors='replace').strip(); err=pathlib.Path('/tmp/err').read_text(errors='replace').strip()
          payload={'status':'success' if rc==0 else 'failed','exit_code':rc,'stderr':err[-18000:]}
          if out:
              try: payload['result']=json.loads(out)
              except Exception: payload['stdout']=out[-50000:]
          pathlib.Path('.ops/move-service-links-header-footer.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          exit 0
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/move-service-links-header-footer.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record header/footer service-link change'
          git pull --rebase origin main
          git push
