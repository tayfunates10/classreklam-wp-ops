name: Apply Phase 1 Browser Session v2

on:
  push:
    paths:
      - '.github/workflows/apply-phase1-browser-session-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Login, diagnose and apply
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_LOGIN_USER: ${{ secrets.WP_LOGIN_USER }}
          WP_LOGIN_PASSWORD: ${{ secrets.WP_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set +e
          mkdir -p .ops
          base="${WP_URL%/}"
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          jar=/tmp/wp-cookies.txt
          curl -A "$ua" -sS --max-time 20 -c "$jar" "$base/wp-login.php" -o /tmp/pre.html
          curl -A "$ua" -sS --max-time 30 -b "$jar" -c "$jar" -L \
            --data-urlencode "log=$WP_LOGIN_USER" \
            --data-urlencode "pwd=$WP_LOGIN_PASSWORD" \
            --data-urlencode "wp-submit=Log In" \
            --data-urlencode "redirect_to=$base/wp-admin/" \
            --data-urlencode "testcookie=1" \
            "$base/wp-login.php" -o /tmp/post.html
          if ! grep -q 'wordpress_logged_in_' "$jar"; then
            python3 - <<'PY'
          import json,re,html,pathlib,os
          raw=pathlib.Path('/tmp/post.html').read_text(errors='replace')
          m=re.search(r'id=["\']login_error["\'][^>]*>(.*?)</div>',raw,re.I|re.S)
          err=''
          if m:
              err=html.unescape(re.sub(r'<[^>]+>',' ',m.group(1)))
              err=re.sub(r'\s+',' ',err).strip()
              u=os.environ.get('WP_LOGIN_USER','')
              if u: err=err.replace(u,'<redacted-user>')
          pathlib.Path('.ops/browser-session-phase1-v2.json').write_text(json.dumps({'status':'login-failed','sanitized_login_error':err[:700]},ensure_ascii=False,indent=2)+'\n')
          PY
            exit 0
          fi
          nonce=$(curl -A "$ua" -sS --max-time 20 -b "$jar" -e "$base/wp-admin/" "$base/wp-admin/admin-ajax.php?action=rest-nonce" | tr -d '\r\n')
          if [ -z "$nonce" ] || [ "$nonce" = "-1" ] || [ "$nonce" = "0" ]; then
            printf '{"status":"nonce-failed"}\n' > .ops/browser-session-phase1-v2.json
            exit 0
          fi
          cookie_header=$(awk 'BEGIN{ORS=""} $0 !~ /^#/ && NF>=7 {if(n++) printf "; "; printf "%s=%s",$6,$7}' "$jar")
          WP_SESSION_COOKIE_HEADER="$cookie_header" WP_REST_NONCE="$nonce" python3 scripts/apply_phase1_cookie.py > /tmp/out 2>/tmp/err
          rc=$?
          python3 - "$rc" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1])
          out=pathlib.Path('/tmp/out').read_text(errors='replace').strip()
          err=pathlib.Path('/tmp/err').read_text(errors='replace').strip()
          pathlib.Path('.ops/browser-session-phase1-v2.json').write_text(json.dumps({'status':'success' if rc==0 else 'failed','exit_code':rc,'stdout':out[-15000:],'stderr':err[-15000:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'classreklam-wp-ops-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/browser-session-phase1-v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record browser-session phase 1 v2 result'
          git pull --rebase origin main
          git push
