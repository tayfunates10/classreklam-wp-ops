name: Actions Runner Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm hosted runner allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "runner-ok"
          uname -a
